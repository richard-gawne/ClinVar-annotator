<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--Title to appear in browser's title bar-->
    <title>ClinVar Annotator</title>
    <!--Bootstrap CSS styling-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid m-5">
    <!--Page title-->
    <h1>ClinVar Annotator</h1>
    <!--App description-->
    <p>Annotate variants using data from ClinVar, and explore the results.</p>
    <!--Form to upload a VCF file (accepts .vcf files)-->
    <p>Please upload a VCF (GRCh38 reference assembly):</p>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="vcf_files" multiple accept=".vcf" class="form-control mb-3">
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
</div>
</body>
</html>
