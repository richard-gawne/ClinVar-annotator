<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Annotated Variants</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <h1>ClinVar Annotated Variants</h1>
    <table id="variants" class="display table table-bordered">
        <thead>
            <tr>
                <th>Patient ID</th>
                <th>Chromosome</th>
                <th>Position</th>
                <th>Reference</th>
                <th>Alternate</th>
                <th>ClinVar Annotations</th>
            </tr>
        </thead>
        <tbody>
        {% for pv in patient_variants %}
            <tr>
                <td>{{ pv.patient_id }}</td>
                <td>{{ pv.chrom }}</td>
                <td>{{ pv.pos }}</td>
                <td>{{ pv.ref }}</td>
                <td>{{ pv.alt }}</td>
                <td><pre>{{ pv.clinvar | tojson(indent=2) }}</pre></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<script>
$(document).ready(function() {
    $('#variants').DataTable({
        dom: 'Bfrtip',
        buttons: ['csvHtml5']
    });
});
</script>
</body>
</html>
