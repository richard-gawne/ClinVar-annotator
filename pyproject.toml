[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinvar-annotator"
version = "0.1.0"
description = "ClinVar variant annotation tool"
requires-python = ">=3.8"
dependencies = [
    # Add your dependencies here
    "pytest>=7.0.0",
    # Add other dependencies from your requirements.txt
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clinvar_anno_core*", "clinvar_anno_app*"]
exclude = ["tests*", "logs*", "docs*", "ClinVar_annotator*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml"]